# To see what each property does see here: https://yarnpkg.com/configuration/yarnrc

# Only allow git: dependencies from Siren repositories.
# Yarn 4.x requires explicit approval for git-hosted dependencies (enableStrictSettings default).
approvedGitRepositories:
  - "github.com/sirensolutions/*"

compressionLevel: 0

defaultSemverRangePrefix: ""

enableGlobalCache: false

# Yarn 4.17+ defaults enableScripts to false. We need lifecycle scripts (postinstall, etc.)
# for native addons and build steps, so this must be explicitly enabled.
enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

# Age gate can be bypassed by setting YARN_NPM_MINIMAL_AGE_GATE=0 env variable.
npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.17.1.cjs
